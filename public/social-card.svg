<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">JSON-to-Something social card</title>
  <desc id="desc">JSON to TypeScript, Zod, JSON Schema, Nginx, and Envoy converter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="0.55" stop-color="#0f2f27" />
      <stop offset="1" stop-color="#1f7a54" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1040" cy="110" r="190" fill="#85d997" opacity="0.12" />
  <circle cx="120" cy="570" r="240" fill="#66d3d1" opacity="0.12" />
  <g filter="url(#shadow)">
    <rect x="82" y="82" width="1036" height="466" rx="34" fill="#111827" opacity="0.82" />
    <rect x="82.5" y="82.5" width="1035" height="465" rx="33.5" fill="none" stroke="#85d997" stroke-opacity="0.28" />
  </g>
  <text x="132" y="164" fill="#85d997" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="700">JSON-to-Something</text>
  <text x="132" y="260" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="800">JSON to TypeScript,</text>
  <text x="132" y="342" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="800">Zod and JSON Schema</text>
  <text x="132" y="420" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="500">Plus YAML to Nginx and Envoy config. Runs locally in your browser.</text>
  <g transform="translate(132 472)">
    <rect width="186" height="48" rx="24" fill="#1f7a54" />
    <text x="28" y="32" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Free tool</text>
    <rect x="206" width="240" height="48" rx="24" fill="#ffffff" opacity="0.1" />
    <text x="234" y="32" fill="#d1fae5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Client-side privacy</text>
  </g>
</svg>
